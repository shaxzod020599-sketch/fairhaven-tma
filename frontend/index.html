<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="FairHaven — витамины и добавки с доставкой в Ташкенте" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Cache-bust: force reload if build changed. -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="build-id" content="__BUILD_ID__" />

    <title>FairHaven — Витамины и добавки</title>

    <!-- Cache-bust guard. In its own file, not inline, so the CSP can forbid
         inline scripts outright — see public/build-guard.js. No defer/async:
         it must finish before the bundle loads. -->
    <script src="/build-guard.js" data-build-id="__BUILD_ID__"></script>

    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
