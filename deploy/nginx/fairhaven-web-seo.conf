# fairhaven.uz — per-page HTML from the backend (search engines).
#
# Goes into /etc/nginx/snippets/fairhaven-web-common.conf in place of the old
#     location / { try_files $uri /index.html; }
# Files that exist (assets, icons, robots.txt) are still served from disk.
# Every page URL is rendered by the backend (backend/controllers/seoController.js)
# with its own title, description, canonical and structured data, and unknown
# URLs answer 404. If the backend is down, the old static shell is served, so
# the site never breaks because of this.
#
# The backend must read index.html from this same build: PUBLIC_WEB_DIST=/var/www/fairhaven-web
# in ~/fairhaven-tma/.env.

location / {
    try_files $uri @fh_page;
}

location = /sitemap.xml {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    error_page 502 503 504 = @fh_static;
}

location @fh_page {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Admin-Telegram-Id "";
    proxy_set_header X-Telegram-Init-Data "";
    # nginx's own security headers above stay the only ones on pages (the
    # backend's CSP is stricter and would break the checkout map).
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-Powered-By;
    limit_req zone=fairhaven_api burst=150 nodelay;
    error_page 502 503 504 = @fh_static;
}

# Backend unreachable: the plain shell (or the static sitemap) from disk.
location @fh_static {
    try_files $uri /index.html;
}
