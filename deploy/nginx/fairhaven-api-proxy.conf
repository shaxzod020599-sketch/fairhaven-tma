# Shared proxy body for the two channel prefixes on api.fairhaven.uz.
proxy_pass http://127.0.0.1:3100;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Never forward client hop-by-hop headers to the application.
proxy_set_header Connection "";
proxy_set_header Keep-Alive "";
proxy_set_header Proxy-Authenticate "";
proxy_set_header Proxy-Authorization "";
proxy_set_header Proxy-Connection "";
proxy_set_header TE "";
proxy_set_header Trailer "";
proxy_set_header Transfer-Encoding "";
proxy_set_header Upgrade "";

# Do not disclose upstream implementation details.
proxy_hide_header Server;
proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-AspNetMvc-Version;
proxy_hide_header X-Runtime;

proxy_connect_timeout 30s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;

# The hub already limits each key to 240 requests a minute. This is the per-IP
# backstop underneath it, for a caller with no valid key at all.
limit_req zone=fairhaven_channel_api burst=60 nodelay;
limit_req_status 429;
