# Shared proxy body for the two channel prefixes on api.fairhaven.uz.
proxy_pass http://127.0.0.1:3100;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_hide_header X-Powered-By;
proxy_read_timeout 60s;

# The hub already limits each key to 240 requests a minute. This is the per-IP
# backstop underneath it, for a caller with no valid key at all.
limit_req zone=fairhaven_api burst=100 nodelay;

add_header Cache-Control "no-store" always;
