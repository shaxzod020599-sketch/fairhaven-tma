# HTTP-context logging and rate-limit policy for api.fairhaven.uz.
#
# Medicalka's contract carries the credentials in the query string
# (`?token=…`, `?secret=…`). nginx's default `combined` format logs `$request`,
# which is the full request line — so every key would be written to disk in
# plaintext and kept there for as long as the logs are retained, readable by
# anyone with log access and copied into every backup.
#
# `$uri` is the path with the query string removed. Referer is deliberately not
# logged because it can itself contain credentials in a query string.
log_format fh_api_nokeys '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent"';

# Per-source-IP backstop. Application credentials have a separate app-level
# quota; this zone bounds unauthenticated traffic before it reaches the hub.
limit_req_zone $binary_remote_addr zone=fairhaven_channel_api:10m rate=300r/m;
