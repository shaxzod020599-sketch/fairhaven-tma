# Access-log format for api.fairhaven.uz.
#
# Medicalka's contract carries the credentials in the query string
# (`?token=…`, `?secret=…`). nginx's default `combined` format logs `$request`,
# which is the full request line — so every key would be written to disk in
# plaintext and kept there for as long as the logs are retained, readable by
# anyone with log access and copied into every backup.
#
# `$uri` is the path with the query string removed. Everything else matches
# `combined`, so existing log tooling still parses it.
log_format fh_api_nokeys '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
