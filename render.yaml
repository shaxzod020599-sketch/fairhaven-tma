services:
  - type: web
    name: fairhaven
    runtime: node
    buildCommand: npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: YANDEX_MAPS_API_KEY
        sync: false
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: https://mini.fairhaven.uz
      - key: PUBLIC_ORIGIN
        value: https://fairhaven.uz
      - key: ADMIN_ORIGIN
        value: https://admin.fairhaven.uz
      - key: TMA_ORIGIN
        value: https://mini.fairhaven.uz
      - key: ADMIN_PANEL_URL
        value: https://admin.fairhaven.uz/
      - key: ADMIN_CSRF_SECRET
        sync: false
      - key: WEB_JWT_SECRET
        sync: false
      - key: WEB_BOT_USERNAME
        sync: false
      - key: NODE_ENV
        value: production
